name: CI

# Pull requests exist in this repository to set GITHUB_BASE_REF for the dogfood workflow, not
# to find a reviewer who does not exist — so there is no branch protection requiring approvals.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Both operating systems, and this is the one place worth the minutes: Reach identifies a
    # first-party assembly by the source documents its debug symbols point at, and routes a
    # changed file by matching those paths against the working tree. Separators and case
    # sensitivity are exactly where Windows and Linux differ, and the tool is developed on
    # Windows. A path-comparison bug on Linux is silent under-selection.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    env:
      # The gate runs `dotnet format` itself; the pre-commit hook has no job here.
      HUSKY: 0

    steps:
      # No actions/setup-dotnet: both runner images already carry several .NET 10 feature
      # bands, and global.json pins the floor.
      - uses: actions/checkout@v5

      # No git identity step: TempRepository.Create sets user.name and user.email on each
      # repository it makes, so the suite never depends on the machine's own — which is also
      # what lets dogfood.yml be a recipe an adopter can copy unchanged.
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release -warnaserror --no-restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      # Reach's own test project, not the solution: the solution also holds the sample
      # solutions' projects, whose NUnit and framework-less test projects use VSTest, which the
      # testing-platform runner set in global.json rejects. Those sample tests run only through
      # Reach, inside the acceptance tests.
      # --report-xunit-trx needs no extra package. --report-trx and --coverage are Microsoft
      # extensions that exit 5 without theirs; do not use them.
      # Two steps over the one build, so a failure names the layer that failed: the fast layer
      # first, then the acceptance layer (the Reach.Tests.Acceptance namespace).
      - name: Test (fast layer)
        id: fast
        run: dotnet test --project tests/Reach.Tests/Reach.Tests.csproj -c Release --no-build --report-xunit-trx --report-xunit-trx-filename fast.trx --results-directory ./TestResults -- --filter-not-namespace "Reach.Tests.Acceptance*"

      # Runs whenever the fast layer ran, pass or fail, so one push reports both layers.
      # The timeout guards against a hung build inside a test. It is not a time budget: the
      # acceptance layer has none.
      - name: Test (acceptance layer)
        if: ${{ !cancelled() && (steps.fast.outcome == 'success' || steps.fast.outcome == 'failure') }}
        timeout-minutes: 20
        run: dotnet test --project tests/Reach.Tests/Reach.Tests.csproj -c Release --no-build --report-xunit-trx --report-xunit-trx-filename acceptance.trx --results-directory ./TestResults -- --filter-namespace "Reach.Tests.Acceptance*"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults
          if-no-files-found: ignore
